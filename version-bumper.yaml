presets:
  - typo3-commit-guidelines

filesToModify:
  # GitHub workflows
  - &file
    path: '.github/workflows/*.yaml'
    patterns:
      - 'eliashaeussler/gha/[^@]+@{%version%}'

  # GitHub actions
  - <<: *file
    path: '.github/actions/**/action.yaml'

  # Documentation code examples
  - <<: *file
    path: 'docs/*.md'

releaseOptions:
  commitMessage: '[RELEASE] Release of gha {%version%}'
  signTag: true
