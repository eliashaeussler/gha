name: 'Setup Node environment'

inputs:
  node-version:
    description: 'Node version to use (defaults to "lts/*")'
    default: 'lts/*'
  cache:
    description: 'Package manager cache to use (defaults to "npm")'
    default: npm
  base-path:
    description: 'Path to package.json (defaults to project directory)'
    default: .

runs:
  using: composite
  steps:
    - name: 'Setup Node'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.base-path }}/package-lock.json
