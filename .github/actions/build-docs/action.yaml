name: 'Build documentation'

inputs:
  command:
    description: 'npm script to render pages'
    default: docs

runs:
  using: composite
  steps:
    - name: 'Setup Node'
      uses: eliashaeussler/gha/.github/actions/setup-node@d84bb06ae7eb7c32f95b146adfaf125e47eb966e # main

    - name: 'Install npm packages'
      uses: eliashaeussler/gha/.github/actions/npm-install@d84bb06ae7eb7c32f95b146adfaf125e47eb966e # main

    - name: 'Render documentation'
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: npm run $BUILD_COMMAND
      shell: bash
