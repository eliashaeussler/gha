name: 'Build documentation'

inputs:
  command:
    description: 'npm script to render pages'
    default: docs

runs:
  using: composite
  steps:
    - name: 'Setup Node'
      uses: eliashaeussler/gha/.github/actions/setup-node@4d61da867e244a11cc0d57fe25dca3fa2ec349df # main

    - name: 'Install npm packages'
      uses: eliashaeussler/gha/.github/actions/npm-install@4d61da867e244a11cc0d57fe25dca3fa2ec349df # main

    - name: 'Render documentation'
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: npm run $BUILD_COMMAND
      shell: bash
