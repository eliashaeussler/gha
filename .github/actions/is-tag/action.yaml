name: 'Check if workflow is from tag'

outputs:
  is-tag:
    description: 'Describes whether current workflow execution originates from a tag push event.'
    value: ${{ steps.is-tag.outputs.is-tag }}
  is-version:
    description: 'Describes whether the tag is a version tag.'
    value: ${{ steps.is-tag.outputs.is-version }}

runs:
  using: composite
  steps:
    - name: 'Check if workflow is from version tag'
      id: is-tag
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [[ "$REF_TYPE" != "tag" ]]; then
          echo "is-tag=false" >> $GITHUB_OUTPUT
          echo "is-version=false" >> $GITHUB_OUTPUT
        else
          echo "is-tag=true" >> $GITHUB_OUTPUT
          
          if [[ "$REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is-version=true" >> $GITHUB_OUTPUT
          else
            echo "is-version=false" >> $GITHUB_OUTPUT
          fi
        fi
      shell: bash
