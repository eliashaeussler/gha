name: 'Build Docker images'

inputs:
  images:
    description: 'Docker image names to build and push'
    default: ${{ github.repository }}
  tag-name:
    description: 'Additional image tag name'
    default: ${{ github.ref_name }}
  context:
    description: 'Path to Dockerfile (defaults to root project directory)'
    default: .
  push:
    description: 'Pass "true" to push Docker images to registries'
    default: 'true'
  dockerhub-username:
    description: 'Optional username for DockerHub (if omitted, no push will be performed)'
  dockerhub-token:
    description: 'Optional access token for DockerHub (if omitted, no push will be performed)'
  ghcr-username:
    description: 'Optional username for GHCR (if omitted, no push will be performed)'
    default: ${{ github.repository_owner }}
  ghcr-token:
    description: 'Optional access token for GHCR (if omitted, no push will be performed)'

outputs:
  artifact-name:
    description: 'Name of the uploaded artifact'
    value: phar

runs:
  using: composite
  steps:
    - name: 'Generate image metadata'
      id: meta
      uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
      with:
        images: ${{ inputs.images }}
        tags: |
          type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}
          type=semver,pattern={{version}}
          type=raw,value=${{ inputs.tag-name }},enable=${{ github.event_name == 'workflow_dispatch' }}

    - name: 'Set up QEMU'
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

    - name: 'Set up Docker Buildx'
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

    - name: 'Login to Docker Hub'
      if: ${{ inputs.dockerhub-username && inputs.dockerhub-token }}
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: 'Login to GHCR'
      if: ${{ inputs.ghcr-username && inputs.ghcr-token }}
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
      with:
        registry: ghcr.io
        username: ${{ inputs.ghcr-username }}
        password: ${{ inputs.ghcr-token }}

    - name: 'Build and push'
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
      with:
        context: ${{ inputs.context }}
        push: ${{ inputs.push }}
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
