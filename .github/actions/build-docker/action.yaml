name: 'Build Docker images'

inputs:
  images:
    description: 'Docker image names to build and push'
  tag-name:
    description: 'Additional image tag name'
    default: ${{ github.ref_name }}
  context:
    description: 'Path to Dockerfile (defaults to root project directory)'
    default: .
  push:
    description: 'Pass "true" to push Docker images to registries'
    default: 'true'
  dockerhub-username:
    description: 'Optional username for DockerHub (if omitted, no push will be performed)'
  dockerhub-token:
    description: 'Optional access token for DockerHub (if omitted, no push will be performed)'
  ghcr-username:
    description: 'Username for GHCR'
    default: ${{ github.repository_owner }}
  ghcr-token:
    description: 'Optional access token for GHCR (if omitted, no push will be performed)'

runs:
  using: composite
  steps:
    - name: 'Check DockerHub'
      id: dockerhub
      env:
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub-username }}
        DOCKERHUB_TOKEN: ${{ inputs.dockerhub-token }}
      run: |
        if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: 'Check GHCR'
      id: ghcr
      env:
        GHCR_USERNAME: ${{ inputs.ghcr-username }}
        GHCR_TOKEN: ${{ inputs.ghcr-token }}
      run: |
        if [ -n "$GHCR_USERNAME" ] && [ -n "$GHCR_TOKEN" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: 'Determine Docker images'
      id: images
      env:
        INPUT_IMAGES: ${{ inputs.images }}
        REPO_NAME: ${{ github.repository }}
        DOCKERHUB_ENABLED: ${{ steps.dockerhub.outputs.enabled }}
        GHCR_ENABLED: ${{ steps.ghcr.outputs.enabled }}
      run: |
        if [ -n "$images" ]; then
          echo "custom=${INPUT_IMAGES}" >> "$GITHUB_OUTPUT"
        else
          if [[ "$DOCKERHUB_ENABLED" == "true" ]]; then
            image="$REPO_NAME"
            echo "dockerhub=${image}" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GHCR_ENABLED" == "true" ]]; then
            image="ghcr.io/${REPO_NAME}"
            echo "ghcr=${image}" >> "$GITHUB_OUTPUT"
          fi
        fi
      shell: bash

    - name: 'Generate image metadata'
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ${{ steps.images.outputs.custom }}
          ${{ steps.images.outputs.dockerhub }}
          ${{ steps.images.outputs.ghcr }}
        tags: |
          type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}
          type=semver,pattern={{version}}
          type=raw,value=${{ inputs.tag-name }},enable=${{ github.event_name == 'workflow_dispatch' }}

    - name: 'Set up QEMU'
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: 'Set up Docker Buildx'
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: 'Login to Docker Hub'
      if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
      uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: 'Login to GHCR'
      if: ${{ steps.ghcr.outputs.enabled == 'true' }}
      uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
      with:
        registry: ghcr.io
        username: ${{ inputs.ghcr-username }}
        password: ${{ inputs.ghcr-token }}

    - name: 'Build and push'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ inputs.context }}
        push: ${{ inputs.push }}
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
