name: 'Asset integrity'

on:
  workflow_call:
    secrets:
      ASSETS_TOKEN:
        description: 'GitHub token used to checkout and commit modified assets'
        required: true

    inputs:
      build-command:
        description: 'npm command used to rebuild assets (defaults to "build")'
        default: build
        type: string
      base-path:
        description: 'Base path to assets (defaults to project directory)'
        default: .
        type: string
      commit-message:
        description: 'Commit message used to commit rebuilt assets'
        default: '[TASK] Automatically rebuild frontend assets'
        type: string
      commit-author-name:
        description: 'Author name used for the asset commit'
        default: 'Elias Häußler'
        type: string
      commit-author-email:
        description: 'Author email used for the asset commit'
        default: 'elias@haeussler.dev'
        type: string

    outputs:
      rebuilt:
        description: 'Describes whether assets files have been rebuilt and committed'
        value: ${{ jobs.rebuild.outputs.rebuilt || 'false' }}

env:
  BASE_PATH: ${{ inputs.base-path }}
  BUILD_COMMAND: ${{ inputs.build-command }}

jobs:
  verify:
    name: 'Verify asset integrity'
    runs-on: ubuntu-latest

    outputs:
      modified: ${{ steps.check.outputs.modified }}

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@0.5.4
        with:
          token: ${{ secrets.ASSETS_TOKEN }}
          fetch-depth: 2

      - name: 'Check modified assets'
        id: check
        run: |
          if git diff --name-only ${{ github.sha }}~1 ${{ github.sha }} | grep -q "^${BASE_PATH}/"; then
            echo "modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "modified=false" >> "$GITHUB_OUTPUT"
          fi

  rebuild:
    name: 'Rebuild assets'
    runs-on: ubuntu-latest

    needs: [verify]
    if: ${{ needs.verify.outputs.modified == 'true' }}

    outputs:
      rebuilt: ${{ steps.commit.outputs.changes_detected || 'false' }}

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@0.5.4
        with:
          token: ${{ secrets.ASSETS_TOKEN }}

      - name: 'Setup Node'
        uses: eliashaeussler/gha/.github/actions/setup-node@0.5.4
        with:
          base-path: ${{ inputs.base-path }}

      - name: 'Install npm packages'
        uses: eliashaeussler/gha/.github/actions/npm-install@0.5.4
        with:
          base-path: ${{ inputs.base-path }}

      - name: 'Rebuild assets'
        run: npm --prefix "$BASE_PATH" run "$BUILD_COMMAND"

      - name: 'Reset package files'
        run: git checkout "${BASE_PATH}/package.json" "${BASE_PATH}/package-lock.json"

      - name: 'Check if workflow is from Renovate'
        id: is-renovate
        uses: eliashaeussler/gha/.github/actions/is-renovate@0.5.4

      - name: 'Fail on integrity mismatch'
        if: ${{ steps.is-renovate.outputs.is-renovate == 'false' }}
        run: |
          git add -A
          git diff --exit-code --staged

      - name: 'Commit rebuilt assets'
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        if: ${{ steps.is-renovate.outputs.is-renovate == 'true' }}
        id: commit
        with:
          commit_message: ${{ inputs.commit-message }}
          commit_author: '${{ inputs.commit-author-name }} <${{ inputs.commit-author-email }}>'
          commit_user_name: ${{ inputs.commit-author-name }}
          commit_user_email: ${{ inputs.commit-author-email }}
