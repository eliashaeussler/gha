name: 'TYPO3 tests'

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version to use (defaults to "latest")'
        default: latest
        type: string
      typo3-version:
        description: 'TYPO3 version to use'
        required: true
        type: string
      dependencies:
        description: 'Dependency versions to install (defaults to "locked")'
        default: locked
        type: string
      ddev-version:
        description: 'DDEV version to use (defaults to "latest")'
        default: latest
        type: string
      acceptance-report-path:
        description: 'Path to acceptance reports'
        default: Build/tests/log/acceptance-reports
        type: string
      allowed-endpoints:
        description: 'List of allowed outbound endpoints'
        type: string

jobs:
  prepare:
    name: 'Prepare tests'

    permissions:
      contents: read

    uses: eliashaeussler/gha/.github/workflows/typo3-test-preparation.yaml@1.1.6
    with:
      typo3-version: ${{ inputs.typo3-version }}

  test:
    name: 'Run tests'
    runs-on: ubuntu-latest

    needs: [prepare]

    env:
      typo3DatabaseName: typo3
      typo3DatabaseHost: 127.0.0.1
      typo3DatabaseUsername: root
      typo3DatabasePassword: root

    permissions:
      contents: read

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@1.1.6
        with:
          egress-policy: ${{ case(needs.prepare.outputs.has-acceptance-tests == 'true', 'audit', 'block') }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}

      - name: 'Setup PHP'
        uses: eliashaeussler/gha/.github/actions/setup-php@1.1.6
        with:
          php-version: ${{ inputs.php-version }}

      - name: 'Setup DDEV'
        if: ${{ needs.prepare.outputs.use-ddev == 'true' }}
        uses: eliashaeussler/gha/.github/actions/setup-ddev@1.1.6
        with:
          ddev-version: ${{ inputs.ddev-version }}
          php-version: ${{ inputs.php-version }}

      - name: 'Start MySQL'
        if: ${{ needs.prepare.outputs.use-ddev == 'false' && needs.prepare.outputs.has-functional-tests == 'true' }}
        run: sudo /etc/init.d/mysql start

      - name: 'Install Composer packages'
        uses: eliashaeussler/gha/.github/actions/composer-install@1.1.6
        with:
          dependencies: ${{ inputs.dependencies }}
          composer-options: >-
            --with=typo3/cms-core:~${{ inputs.typo3-version }}.0
            ${{ needs.prepare.outputs.requires-compatibility-update == 'true' && '--no-plugins --no-scripts' || '' }}

      - name: 'Install Composer packages (compatibility update)'
        if: ${{ needs.prepare.outputs.requires-compatibility-update == 'true' }}
        uses: eliashaeussler/gha/.github/actions/composer-install@1.1.6

      - name: 'Run functional tests'
        if: ${{ needs.prepare.outputs.has-functional-tests == 'true' }}
        env:
          COMMAND: ${{ needs.prepare.outputs.test-command }}
        run: $COMMAND test:functional

      - name: 'Run unit tests'
        if: ${{ needs.prepare.outputs.has-unit-tests == 'true' }}
        env:
          COMMAND: ${{ needs.prepare.outputs.test-command }}
        run: $COMMAND test:unit

      - name: 'Run acceptance tests'
        if: ${{ needs.prepare.outputs.has-acceptance-tests == 'true' }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 10
          command: '${{ needs.prepare.outputs.test-command }} test:acceptance'
          new_command_on_retry: '${{ needs.prepare.outputs.test-command }} test:acceptance -- -g failed'

      - name: 'Save acceptance reports'
        if: ${{ needs.prepare.outputs.has-acceptance-tests == 'true' && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-reports-${{ inputs.php-version }}-${{ inputs.typo3-version }}-${{ inputs.dependencies }}
          path: |
            ${{ inputs.acceptance-report-path }}
            var/log/typo3_*.log
