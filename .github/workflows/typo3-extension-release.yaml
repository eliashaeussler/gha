name: 'TYPO3 extension release'

on:
  workflow_call:
    secrets:
      TYPO3_API_TOKEN:
        description: 'API token used to authenticate at extensions.typo3.org'
        required: true

    inputs:
      extension-key:
        description: 'TYPO3 extension key (defaults to auto-detection via composer.json)'
        type: string
      extension-version:
        description: 'The extension version to release (defaults to tag name)'
        default: ${{ github.ref_name }}
        type: string
      php-version:
        description: 'PHP version to use (defaults to "latest")'
        default: latest
        type: string
      packaging-excludes-file:
        description: 'Optional path to packaging_exclude.php'
        type: string

env:
  EXTENSION_KEY: ${{ inputs.extension-key }}
  EXTENSION_VERSION: ${{ inputs.extension-version }}
  TYPO3_EXCLUDE_FROM_PACKAGING: ${{ inputs.packaging-excludes-file }}

jobs:
  artefact:
    name: 'Build extension artefact'
    runs-on: ubuntu-latest

    outputs:
      extension-artifact-name: extension-artefact
      extension-artefact-file: ${{ steps.extension.outputs.artefact }}

    permissions:
      contents: read

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@1.0.0

      - name: 'Check tag'
        uses: eliashaeussler/gha/.github/actions/assure-version-tag@1.0.0
        with:
          tag-name: ${{ inputs.extension-version }}

      - name: 'Lookup extension key'
        id: extension
        run: |
          if [ -z "$EXTENSION_KEY" ]; then
            EXTENSION_KEY="$(jq -r '.extra."typo3/cms"."extension-key"' composer.json)"
          fi

          echo "key=${EXTENSION_KEY}" >> "$GITHUB_OUTPUT"
          echo "artefact=${EXTENSION_KEY}_${EXTENSION_VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: 'Check bundler'
        id: bundler
        run: |
          bundlerVersion="$(jq -r '."require-dev"."eliashaeussler/typo3-vendor-bundler" // empty' composer.json)"

          if [ -n "$bundlerVersion" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Setup PHP'
        uses: eliashaeussler/gha/.github/actions/setup-php@1.0.0
        with:
          php-version: ${{ inputs.php-version }}
          tools: typo3/tailor

      - name: 'Install Composer dependencies'
        if: ${{ steps.bundler.outputs.enabled == 'true' }}
        uses: eliashaeussler/gha/.github/actions/composer-install@1.0.0
        with:
          ignore-cache: true

      - name: 'Bundle vendor libraries'
        if: ${{ steps.bundler.outputs.enabled == 'true' }}
        run: composer bundle -v

      - name: 'Stash bundled files'
        if: ${{ steps.bundler.outputs.enabled == 'true' }}
        run: |
          git add -f Resources/Private/Libs
          git stash push -- composer.json Resources/Private/Libs

      - name: 'Reset files'
        run: git reset --hard HEAD && git clean -dfx

      - name: 'Restore bundled files'
        if: ${{ steps.bundler.outputs.enabled == 'true' }}
        run: git stash pop

      - name: 'Create extension artefact'
        run: |
          php ~/.composer/vendor/bin/tailor set-version "$EXTENSION_VERSION"
          php ~/.composer/vendor/bin/tailor create-artefact "$EXTENSION_VERSION"

      - name: 'Upload extension artefact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-artefact
          path: tailor-version-artefact/${{ steps.extension.outputs.artefact }}
          if-no-files-found: error

  release:
    name: 'Create release'

    needs: [artefact]

    permissions:
      contents: write

    uses: eliashaeussler/gha/.github/workflows/github-release.yaml@1.0.0
    with:
      version: ${{ inputs.extension-version }}
      artifact-name: ${{ needs.artefact.outputs.extension-artifact-name }}

  publish:
    name: 'Publish on TER'
    runs-on: ubuntu-latest

    needs: [artefact, release]

    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}

    permissions:
      contents: read

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@1.0.0

      - name: 'Download extension artefact'
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.artefact.outputs.extension-artifact-name }}

      - name: 'Setup PHP'
        uses: eliashaeussler/gha/.github/actions/setup-php@1.0.0
        with:
          php-version: ${{ inputs.php-version }}
          tools: typo3/tailor

      - name: 'Check for security release'
        id: is-security
        uses: eliashaeussler/gha/.github/actions/is-security-release@1.0.0
        with:
          release-version: ${{ inputs.extension-version }}

      - name: 'Build release comment'
        id: release-comment
        env:
          IS_SECURITY: ${{ steps.is-security.outputs.is-security }}
          RELEASE_URL: ${{ needs.release.outputs.url }}
        run: |
          RELEASE_COMMENT="See release notes at ${RELEASE_URL}"

          if [ "$IS_SECURITY" = "true" ]; then
            RELEASE_COMMENT="This is a security release! ${RELEASE_COMMENT}"
          fi

          echo "comment=${RELEASE_COMMENT}" >> "$GITHUB_OUTPUT"

      - name: 'Publish to TER'
        env:
          RELEASE_ARTEFACT: ${{ steps.download.outputs.download-path }}/${{ needs.artefact.outputs.extension-artefact-file }}
          RELEASE_COMMENT: ${{ steps.release-comment.outputs.comment }}
        run: |
          php ~/.composer/vendor/bin/tailor ter:publish \
            --comment "$RELEASE_COMMENT" \
            --artefact "$RELEASE_ARTEFACT" \
            "$EXTENSION_VERSION"
