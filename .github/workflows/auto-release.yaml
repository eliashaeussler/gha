name: Auto-release

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry Run: Do not push new version'
        default: false
        type: boolean

jobs:
  evaluate:
    name: 'Evaluate release requirements'
    runs-on: ubuntu-latest

    outputs:
      continue: ${{ steps.breaking-changes.outputs.found == 'false' && steps.renovate-updates.outputs.found == 'true' }}

    permissions:
      contents: read

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@1.1.32
        with:
          fetch-depth: 0
          # Must be true, otherwise new commits cannot be pushed
          persist-credentials: true

      - name: 'Determine last version tag'
        id: last-version
        run: |
          lastTag="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' HEAD)"
          echo "tag-name=${lastTag}" >> "$GITHUB_OUTPUT"
          echo "### 🕵️‍♂️ Evaluation result for \`${lastTag}..HEAD\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 'Check minimum release interval'
        id: release-interval
        env:
          LAST_TAG: ${{ steps.last-version.outputs.tag-name }}
          MIN_INTERVAL_DAYS: '3'
          EVENT_NAME: ${{ github.event_name }}
        run: |
          lastTagTs="$(git log -1 --format=%ct "${LAST_TAG}")"
          ageDays=$(( ( $(date +%s) - lastTagTs ) / 86400 ))

          # Manually triggered runs are not restricted by the interval
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$ageDays" -lt "$MIN_INTERVAL_DAYS" ]; then
            echo "too-recent=true" >> "$GITHUB_OUTPUT"
            echo "> [!IMPORTANT]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Skipped release, because the last release (\`${LAST_TAG}\`) is only ${ageDays} day(s) old (minimum: ${MIN_INTERVAL_DAYS} days)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "too-recent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Search for breaking changes'
        if: ${{ steps.release-interval.outputs.too-recent == 'false' }}
        id: breaking-changes
        env:
          LAST_TAG: ${{ steps.last-version.outputs.tag-name }}
        run: |
          if git log "${LAST_TAG}..HEAD" --format='%s' | grep -q '^\[!!!\]'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "> [!IMPORTANT]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Skipped release, because it contains breaking changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Search for merged Renovate updates'
        if: ${{ steps.release-interval.outputs.too-recent == 'false' && steps.breaking-changes.outputs.found == 'false' }}
        id: renovate-updates
        env:
          LAST_TAG: ${{ steps.last-version.outputs.tag-name }}
        run: |
          if git log "${LAST_TAG}..HEAD" --format='%an' -- . ':!composer.*' | grep -q 'renovate\[bot\]'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "✅ Relevant dependency updates found, ready to create a new release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "> [!IMPORTANT]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Skipped release, because it does not contain relevant dependency updates." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: 'Create release'
    runs-on: ubuntu-latest

    needs: [evaluate]
    if: ${{ needs.evaluate.outputs.continue == 'true' }}

    permissions:
      contents: read

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@1.1.32
        with:
          fetch-depth: 0
          # Must be true, otherwise new commits cannot be pushed
          persist-credentials: true
          token: ${{ secrets.AUTO_RELEASE_TOKEN }}

      - name: 'Setup PHP'
        uses: eliashaeussler/gha/.github/actions/setup-php@1.1.32

      - name: 'Install Composer packages'
        uses: eliashaeussler/gha/.github/actions/composer-install@1.1.32

      - name: 'Import GPG key'
        id: gpg-key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.AUTO_RELEASE_GPG_KEY }}
          passphrase: ${{ secrets.AUTO_RELEASE_GPG_PASSPHRASE }}

      - name: 'Prepare Git environment'
        uses: eliashaeussler/gha/.github/actions/setup-git@1.1.32
        with:
          signing-key: ${{ steps.gpg-key.outputs.keyid }}

      - name: 'Bump version'
        env:
          DRY_RUN: ${{ github.event.inputs.dryRun }}
          COMMAND_OPTIONS: ${{ github.event.inputs.dryRun && '--dry-run' || '' }}
        run: |
          # shellcheck disable=SC2086
          output="$(composer bump-version --release $COMMAND_OPTIONS)"

          echo "### 📦 Release result" >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "ℹ️ Bumped release, but did not push to main branch, because dry-run is enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            git push --follow-tags
            echo "✅ Bumped release and pushed to main branch." >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
