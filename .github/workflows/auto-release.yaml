name: Auto-release

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry Run: Do not push new version'
        default: false
        type: boolean

jobs:
  evaluate:
    name: 'Evaluate release requirements'
    runs-on: ubuntu-latest

    outputs:
      continue: ${{ steps.breaking-changes.outputs.found == 'false' && steps.renovate-updates.outputs.found == 'true' }}

    permissions:
      contents: read

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@1.1.3
        with:
          fetch-depth: 0
          # Must be true, otherwise new commits cannot be pushed
          persist-credentials: true

      - name: 'Determine last version tag'
        id: last-version
        run: |
          lastTag="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' HEAD)"
          echo "tag-name=${lastTag}" >> "$GITHUB_OUTPUT"
          echo "### 🕵️‍♂️ Evaluation result for \`${lastTag}..HEAD\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 'Search for breaking changes'
        id: breaking-changes
        env:
          LAST_TAG: ${{ steps.last-version.outputs.tag-name }}
        run: |
          if git log "${LAST_TAG}..HEAD" --format='%s' | grep -q '^\[!!!\]'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "> [!IMPORTANT]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Skipped release, because it contains breaking changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Search for merged Renovate updates'
        if: ${{ steps.breaking-changes.outputs.found == 'false' }}
        id: renovate-updates
        env:
          LAST_TAG: ${{ steps.last-version.outputs.tag-name }}
        run: |
          if git log "${LAST_TAG}..HEAD" --format='%an' | grep -q 'renovate\[bot\]'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "✅ Dependency updates found, ready to create a new release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "> [!IMPORTANT]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Skipped release, because it does not contain dependency updates." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: 'Create release'
    runs-on: ubuntu-latest

    needs: [evaluate]
    if: ${{ needs.evaluate.outputs.continue == 'true' }}

    permissions:
      contents: read

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@1.1.3
        with:
          fetch-depth: 0
          # Must be true, otherwise new commits cannot be pushed
          persist-credentials: true
          token: ${{ secrets.AUTO_RELEASE_TOKEN }}

      - name: 'Setup PHP'
        uses: eliashaeussler/gha/.github/actions/setup-php@1.1.3

      - name: 'Install Composer packages'
        uses: eliashaeussler/gha/.github/actions/composer-install@1.1.3

      - name: 'Import GPG key'
        id: gpg-key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.AUTO_RELEASE_GPG_KEY }}
          passphrase: ${{ secrets.AUTO_RELEASE_GPG_PASSPHRASE }}

      - name: 'Prepare Git environment'
        uses: eliashaeussler/gha/.github/actions/setup-git@1.1.3
        with:
          signing-key: ${{ steps.gpg-key.outputs.keyid }}

      - name: 'Bump version'
        env:
          DRY_RUN: ${{ github.event.inputs.dryRun }}
        run: |
          output="$(composer bump-version --release)"

          echo "### 📦 Release result" >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "ℹ️ Bumped release, but did not push to main branch, because dry-run is enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            git push --follow-tags
            echo "✅ Bumped release and pushed to main branch." >> "$GITHUB_STEP_SUMMARY"
            echo "[&raquo; View release]($(gh repo view --json latestRelease -q '.latestRelease.url'))" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
