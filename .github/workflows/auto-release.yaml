name: Auto-release

on:
  schedule:
    - cron: '17 1 * * *'

jobs:
  release:
    name: 'Create release'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@1.0.2
        with:
          fetch-depth: 0
          # Must be true, otherwise new commits cannot be pushed
          persist-credentials: true

      - name: 'Determine last version tag'
        id: last-version
        run: |
          lastTag="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' HEAD)"
          echo "tag-name=${lastTag}" >> "$GITHUB_OUTPUT"

      - name: 'Search for breaking changes'
        id: breaking-changes
        env:
          LAST_TAG: ${{ steps.last-version.outputs.tag-name }}"
        run: |
          if git log "${LAST_TAG}..HEAD" --format='%s' | grep -q '^\[!!!\]'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Search for merged Renovate updates'
        if: ${{ steps.breaking-changes.outputs.found == 'false' }}
        id: renovate-updates
        env:
          LAST_TAG: ${{ steps.last-version.outputs.tag-name }}"
        run: |
          if git log "${LAST_TAG}..HEAD" --format='%an' | grep -q 'renovate\[bot\]'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Setup PHP'
        if: ${{ steps.breaking-changes.outputs.found == 'false' && steps.renovate-updates.outputs.found == 'true' }}
        uses: eliashaeussler/gha/.github/actions/setup-php@1.0.2

      - name: 'Install Composer packages'
        if: ${{ steps.breaking-changes.outputs.found == 'false' && steps.renovate-updates.outputs.found == 'true' }}
        uses: eliashaeussler/gha/.github/actions/composer-install@1.0.2

      - name: 'Bump version'
        if: ${{ steps.breaking-changes.outputs.found == 'false' && steps.renovate-updates.outputs.found == 'true' }}
        run: |
          composer bump-version --release
          git push --follow-tags
