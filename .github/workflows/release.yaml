name: Release

on:
  push:
    tags:
      - '*'

env:
  REF_NAME: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: 'Create release'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@0.2.4

      - name: 'Create release'
        uses: eliashaeussler/gha/.github/actions/create-release@0.2.4
