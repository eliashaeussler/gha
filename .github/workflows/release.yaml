name: Release

on:
  push:
    tags:
      - '*'

env:
  REF_NAME: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: 'Create release'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: 'Create release'
        uses: eliashaeussler/gha/.github/actions/create-release@main
